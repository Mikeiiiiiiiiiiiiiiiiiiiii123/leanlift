<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="LeanLift">
<meta name="theme-color" content="#0b0c0d"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>LeanLift</title>
<style>
@font-face{font-family:Cormorant;src:url(fonts/cormorant-garamond-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Cormorant;src:url(fonts/cormorant-garamond-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Cormorant;src:url(fonts/cormorant-garamond-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Cormorant;src:url(fonts/cormorant-garamond-latin-400-italic.woff2) format('woff2');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:Inter;src:url(fonts/inter-latin-300-normal.woff2) format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:Inter;src:url(fonts/inter-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(fonts/inter-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Inter;src:url(fonts/inter-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
:root{--bg:#0b0c0d;--card:#131516;--c2:#1a1d1e;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--g:#2f7d62;--g2:#5fae8f;--gold:#c9ad7a;--gold2:#e4d3ad;--t:#ecebe6;--m:#8a8f8c;--serif:Cormorant,'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:Inter,-apple-system,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(120% 50% at 50% -10%,rgba(47,125,98,.10),transparent 60%),var(--bg);background-attachment:fixed;color:var(--t);font:400 15px/1.5 var(--sans);letter-spacing:.005em;-webkit-font-smoothing:antialiased;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 104px);min-height:100vh}
#app{animation:fade .45s cubic-bezier(.2,.7,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font:500 34px/1.1 var(--serif);letter-spacing:.01em;margin:8px 0 22px}
h1 em{font-style:italic;color:var(--gold2);font-weight:400}
h2{font:500 21px/1.2 var(--serif);margin:0 0 10px;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
h2 svg{color:var(--gold);flex:none}
.eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:500}
.card{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)),var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 20px 40px -24px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.03)}
.row{display:flex;gap:10px;align-items:center}.sb{justify-content:space-between}.m{color:var(--m);font-size:13px;font-weight:300}
.m b{color:var(--t);font-weight:500}
button{font-family:var(--sans);background:linear-gradient(180deg,#348a6c,#286c55);color:#f3f1ea;border:1px solid rgba(201,173,122,.28);border-radius:12px;padding:11px 16px;font-weight:500;font-size:13.5px;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,opacity .15s,background .2s;box-shadow:0 6px 18px -10px rgba(47,125,98,.8)}
button:active{transform:scale(.97);opacity:.85}
button.s{background:transparent;color:var(--t);border:1px solid var(--line2);box-shadow:none}
button.x{background:none;border:0;color:var(--m);padding:6px 8px;box-shadow:none}
button svg{flex:none}
input,select,textarea{width:100%;font-family:var(--sans);background:rgba(255,255,255,.02);color:var(--t);border:1px solid var(--line2);border-radius:12px;padding:12px 13px;font-size:16px;font-weight:300;outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--m) 50%),linear-gradient(135deg,var(--m) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input[type=checkbox]{width:16px!important;height:16px;padding:0;border-radius:4px;vertical-align:-3px;margin-right:8px}
input[type=checkbox]:checked{background:var(--g);border-color:var(--gold)}
input:focus,select:focus{border-color:rgba(201,173,122,.55)}
input::placeholder{color:#5b605d}
label.m input{margin-top:6px}
.bar{height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;margin:8px 0 16px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--g2));border-radius:2px;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.bl{font-size:13px;letter-spacing:.02em}
nav{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 10px);background:rgba(19,21,22,.72);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--line2);border-radius:24px;display:flex;padding:8px 4px;box-shadow:0 18px 40px -12px rgba(0,0,0,.9);z-index:4}
nav a{flex:1;text-align:center;color:#6f7471;font-size:10px;letter-spacing:.06em;text-decoration:none;padding:6px 0 4px;position:relative;transition:color .25s}
nav a svg{display:block;margin:0 auto 4px}
nav a.on{color:var(--gold2)}
nav a.on:after{content:'';position:absolute;left:50%;top:-1px;width:16px;height:1px;margin-left:-8px;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.ring{width:132px;height:132px;flex:none}.big{font:500 40px/1 var(--serif);letter-spacing:.01em}
.big small{font:300 13px var(--sans);color:var(--m);margin-left:4px}
.item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);gap:10px}
.item:last-child{border-bottom:0}
.pill{border:1px solid rgba(201,173,122,.35);color:var(--gold2);border-radius:20px;padding:5px 12px;font-size:11px;letter-spacing:.08em;display:inline-flex;align-items:center;gap:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.act button{flex-direction:column;padding:16px 10px;gap:8px;border-radius:16px;font-size:12.5px}
.act button.s{background:var(--card)}
.act button svg{color:var(--gold)}
.act button:not(.s) svg{color:var(--gold2)}
.sec{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:18px 0 4px}
.hr{height:1px;background:linear-gradient(90deg,transparent,rgba(201,173,122,.35),transparent);margin:16px 0}
#modal{position:fixed;inset:0;background:rgba(5,6,6,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:none;z-index:9;padding:calc(env(safe-area-inset-top) + 24px) 16px 24px;overflow:auto;animation:fade .3s}
#modal .card{border-color:var(--line2)}
#timer{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 92px);display:none;z-index:5;border-color:rgba(201,173,122,.35);background:rgba(19,21,22,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:14px 16px}
#tt{font:500 26px var(--serif);color:var(--gold2);margin-left:6px}
video{width:100%;border-radius:14px;border:1px solid var(--line2)}img.ph{width:31%;border-radius:12px;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--line)}
a{color:var(--gold2)}
</style></head><body>
<div id="app"></div><div id="timer" class="card row sb"><span class="row" style="gap:6px"><span class="eyebrow">Pause</span><b id="tt"></b></span><span class="row"><button class="s" onclick="addT(30)">+30s</button><button class="s" onclick="stopT()">Stop</button></span></div>
<div id="modal"><div class="card" id="mb"></div></div>
<nav id="nav"></nav>
<script src="zxing.min.js"></script>
<script src="app.js"></script></body></html>
